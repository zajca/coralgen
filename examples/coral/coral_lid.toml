# coralgen run: coral growing from the top plate of the two-part coral lid.
# Frame: plate print frame of examples/coral/coral_lid.scad (plate bottom z = 0, top face z = 2).
# Regenerate the inputs after any lid or case change:
#   openscad -o examples/stl/coral_lid_plate_print.stl   -D 'part="plate_print"'   examples/coral/coral_lid.scad
#   openscad -o examples/stl/coral_lid_plate_cut.stl     -D 'part="plate_cut"'     examples/coral/coral_lid.scad
#   openscad -o examples/stl/coral_lid_plate_keepout.stl -D 'part="plate_keepout"' examples/coral/coral_lid.scad

part = []   # the whole result is one printed piece

[host]
stl = "../stl/coral_lid_plate_print.stl"
cut_stl = "../stl/coral_lid_plate_cut.stl"
keepout_stl = "../stl/coral_lid_plate_keepout.stl"

[seed]
count = 7
min_spacing = 14.0
z_min = 1.9            # plate top face (2 mm plate)
z_max = 2.1
min_normal_z = 0.95    # upward faces only
root_embed = 0.5
surface_samples = 30000
max_hull_depth = 0.5

[envelope]
spread = 42.0          # attractors at most this far from the plate (volume mode)
height_above_top = 38.0
shape = "branching"
attractor_count = 3000
xy_margin = 0.0        # coral stays over the plate footprint
host_clearance = 4.5   # radius.max + growth.branch_gap
keepout_margin = 3.0   # radius.max
field_voxel = 0.5

[branching]
trunk_length = 12.0
length_ratio = 0.8
max_forks = 4
fork_angle_min_deg = 22.0
fork_angle_max_deg = 40.0
wander_deg = 4.0
fork_twist_deg = 0.0
azimuth_jitter_deg = 20.0

[crawl]
surface_samples = 120000
attractor_count = 2500
center_height_ratio = 0.4
snap_limit_ratio = 0.8
smooth_iterations = 4
polyp_probability = 0.12
polyp_length_min = 2.0
polyp_length_max = 4.5

[growth]
step = 1.5
influence = 9.0
kill = 4.5
max_tilt_deg = 40.0      # MINI+ IS profile: 50 deg wedges slice without support; 40 keeps a 10 deg margin
inertia = 0.6
upward_bias = 0.25
max_iterations = 400
min_twig_nodes = 3
branch_gap = 1.5
random_seed = 1

[radius]
tip = 1.8
max = 3.0
pipe_exponent = 2.4

[mesh]
voxel = 0.25
taubin_iterations = 20
preview_sides = 6

[verify]
vendor_bundle = "~/.config/PrusaSlicer/vendor/PrusaResearch.ini"
printer_preset = "Original Prusa MINI & MINI+ Input Shaper"
print_preset = "0.20mm SPEED @MINIIS 0.4"
filament_preset = "Prusament PLA @MINIIS"
support_threshold = 0.0   # PrusaSlicer automatic detection (from extrusion width), not the preset's 55
tolerance = 3.0
z_window = 0.6
max_attempts = 8

[output]
dir = "out"
name = "coral_lid"
