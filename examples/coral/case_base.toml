# coralgen run: coral overgrowing the CoralWatch case base (examples/case/case.scad, part="base").
# No valid root exists on this host with the validated print rules (30 deg tilt, lid lift path,
# ports on every face, 10.6 mm wall); `coralgen grow` reports the filter cascade. Kept as a record.
# All coordinates are the base print frame (bed at z = 0, wall top / parting plane at z = 10.6).
# Regenerate the inputs after any case change:
#   openscad -o examples/stl/case_base.stl         -D 'part="base"'         examples/case/case.scad
#   openscad -o examples/stl/case_base_cut.stl     -D 'part="base_cut"'     examples/case/case.scad
#   openscad -o examples/stl/case_base_keepout.stl -D 'part="base_keepout"' examples/case/case.scad

part = []   # the whole result is one printed piece

[host]
stl = "../stl/case_base.stl"
cut_stl = "../stl/case_base_cut.stl"
keepout_stl = "../stl/case_base_keepout.stl"

[seed]
count = 22
min_spacing = 7.0
z_min = 2.0            # the root extension must stay inside the wall above the bed chamfer
z_max = 3.0            # a 30 deg branch from here clears the lid lift path (z >= 10.4) by keepout_margin
min_normal_z = -0.05   # outer walls (vertical) and anything facing up
root_embed = 0.5
surface_samples = 20000
max_hull_depth = 0.5    # outer walls only: not the nut pockets or rail channels underneath

[envelope]
spread = 26.0
height_above_top = 34.0
shape = "volume"
attractor_count = 4000
xy_margin = 26.0
host_clearance = 4.5
keepout_margin = 2.5
field_voxel = 0.5

[branching]
trunk_length = 12.0
length_ratio = 0.8
max_forks = 4
fork_angle_min_deg = 22.0
fork_angle_max_deg = 40.0
wander_deg = 4.0
fork_twist_deg = 0.0
azimuth_jitter_deg = 20.0

[crawl]
surface_samples = 120000
attractor_count = 2500
center_height_ratio = 0.4
snap_limit_ratio = 0.8
smooth_iterations = 4
polyp_probability = 0.12
polyp_length_min = 2.0
polyp_length_max = 4.5

[growth]
step = 1.5
influence = 14.0
kill = 3.0
max_tilt_deg = 30.0      # PrusaSlicer auto-support stays off at 30 deg; 35 deg already triggers it
inertia = 0.6
upward_bias = 0.25
max_iterations = 400
min_twig_nodes = 3
branch_gap = 1.5
random_seed = 7

[radius]
tip = 1.4
max = 2.5
pipe_exponent = 2.4

[mesh]
voxel = 0.25
taubin_iterations = 20
preview_sides = 6

[verify]
vendor_bundle = "~/.config/PrusaSlicer/vendor/PrusaResearch.ini"
printer_preset = "Original Prusa MINI & MINI+ Input Shaper"
print_preset = "0.20mm SPEED @MINIIS 0.4"
filament_preset = "Prusament PLA @MINIIS"
support_threshold = 0.0   # PrusaSlicer automatic detection (from extrusion width), not the preset's 55
tolerance = 3.0
z_window = 0.6
max_attempts = 8

[output]
dir = "out"
name = "case_base_coral"
