# coralgen run: coral creeping over the whole two-part coral lid and pouring down its sides.
# Frame: case frame of examples/coral/coral_lid.scad (lid top z = 11.2, ring/plate joint z = 9.2).
# Regenerate the inputs after any lid or case change:
#   openscad -o examples/stl/coral_lid_crawl_host.stl    -D 'part="crawl_host"'    examples/coral/coral_lid.scad
#   openscad -o examples/stl/coral_lid_crawl_cut.stl     -D 'part="crawl_cut"'     examples/coral/coral_lid.scad
#   openscad -o examples/stl/coral_lid_crawl_keepout.stl -D 'part="crawl_keepout"' examples/coral/coral_lid.scad

[host]
stl = "../stl/coral_lid_crawl_host.stl"
cut_stl = "../stl/coral_lid_crawl_cut.stl"
keepout_stl = "../stl/coral_lid_crawl_keepout.stl"

[seed]
count = 6
min_spacing = 16.0
z_min = 11.1           # lid top face
z_max = 11.3
min_normal_z = 0.95    # upward faces only
root_embed = 0.5
surface_samples = 30000
max_hull_depth = 0.5

[envelope]
spread = 42.0          # attractors at most this far from the plate (volume mode)
height_above_top = 10.0
shape = "crawl"
attractor_count = 3000
xy_margin = 10.0       # the coral may pour over the edges and down the sides
host_clearance = 3.0   # radius.max + growth.branch_gap (not used while crawling)
keepout_margin = 2.0   # radius.max
field_voxel = 0.5

[branching]
trunk_length = 12.0
length_ratio = 0.8
max_forks = 4
fork_angle_min_deg = 22.0
fork_angle_max_deg = 40.0
wander_deg = 4.0
fork_twist_deg = 0.0
azimuth_jitter_deg = 20.0

[crawl]
surface_samples = 150000
attractor_count = 6000
center_height_ratio = 0.4
snap_limit_ratio = 0.8
smooth_iterations = 4
polyp_probability = 0.06
polyp_length_min = 1.2
polyp_length_max = 3.0

[growth]
step = 1.0
influence = 10.0
kill = 2.0
max_tilt_deg = 40.0      # MINI+ IS profile: 50 deg wedges slice without support; 40 keeps a 10 deg margin
inertia = 0.3
upward_bias = 0.25
max_iterations = 600
min_twig_nodes = 3
branch_gap = 0.8
random_seed = 1

[radius]
tip = 1.0
max = 2.0
pipe_exponent = 2.4

[mesh]
voxel = 0.25
taubin_iterations = 20
preview_sides = 6

[verify]
vendor_bundle = "~/.config/PrusaSlicer/vendor/PrusaResearch.ini"
printer_preset = "Original Prusa MINI & MINI+ Input Shaper"
print_preset = "0.20mm SPEED @MINIIS 0.4"
filament_preset = "Prusament PLA @MINIIS"
support_threshold = 0.0   # PrusaSlicer automatic detection (from extrusion width), not the preset's 55
tolerance = 3.0
z_window = 0.6
max_attempts = 8

[output]
dir = "out"
name = "coral_lid_crawl"

# Printed pieces: the flat plate (coral up) and the ring (upside down, like the standard lid)
[[part]]
name = "plate"
z_min = 9.2
z_max = 100.0
flip = false

[[part]]
name = "ring"
z_min = -50.0
z_max = 9.2
flip = true
